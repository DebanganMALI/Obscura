name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

jobs:
  bundle:
    name: bundle (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: System dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libxdo-dev libssl-dev \
            libayatana-appindicator3-dev librsvg2-dev libudev-dev
          sudo apt-get install -y libfuse2t64 || sudo apt-get install -y libfuse2 || true
      - name: Install the Tauri CLI
        run: cargo install tauri-cli --version "^2" --locked
      - run: cargo tauri build
      - run: cargo build --release --locked -p obscura-cli
      - name: Package the command line tool
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#v}"
          mkdir -p cli
          if [ "$RUNNER_OS" = "Windows" ]; then
            cp target/release/obscura.exe cli/
            (cd cli && 7z a -tzip "../obscura-cli_${version}_x64-windows.zip" obscura.exe)
          else
            cp target/release/obscura cli/
            tar -C cli -czf "obscura-cli_${version}_amd64-linux.tar.gz" obscura
          fi
      - uses: actions/upload-artifact@v7
        with:
          name: bundle-${{ matrix.os }}
          path: |
            target/release/bundle/msi/*.msi
            target/release/bundle/nsis/*-setup.exe
            target/release/bundle/deb/*.deb
            target/release/bundle/rpm/*.rpm
            target/release/bundle/appimage/*.AppImage
            obscura-cli_*.zip
            obscura-cli_*.tar.gz
          if-no-files-found: error

  sbom:
    name: sbom
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - name: Install cargo-cyclonedx
        run: cargo install cargo-cyclonedx --version 0.5.9 --locked
      - name: Describe the application
        run: |
          export SOURCE_DATE_EPOCH="$(git log -1 --format=%ct)"
          cargo cyclonedx --manifest-path src-tauri/Cargo.toml --format json --spec-version 1.5 --target all -q
          cargo cyclonedx --manifest-path crates/obscura-cli/Cargo.toml --format json --spec-version 1.5 --target all -q
          mkdir -p sbom
          cp src-tauri/obscura-app.cdx.json "sbom/Obscura_${GITHUB_REF_NAME}.cdx.json"
          cp crates/obscura-cli/obscura-cli.cdx.json "sbom/obscura-cli_${GITHUB_REF_NAME}.cdx.json"
      - name: Give each SBOM a stable serial number
        shell: python
        run: |
          import json, os, uuid
          tag = os.environ["GITHUB_REF_NAME"]
          release = f"https://github.com/{os.environ['GITHUB_REPOSITORY']}/releases/tag/{tag}"
          for name, anchor in (("Obscura", ""), ("obscura-cli", "#obscura-cli")):
              path = f"sbom/{name}_{tag}.cdx.json"
              with open(path, encoding="utf-8") as f:
                  bom = json.load(f)
              bom["serialNumber"] = uuid.uuid5(uuid.NAMESPACE_URL, release + anchor).urn
              with open(path, "w", encoding="utf-8") as f:
                  json.dump(bom, f, indent=2)
                  f.write("\n")
      - uses: actions/upload-artifact@v7
        with:
          name: sbom
          path: sbom/*.cdx.json
          if-no-files-found: error

  release:
    name: draft the release
    needs: [bundle, sbom]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: staged
      - name: Collect the installers
        run: |
          mkdir -p dist
          find staged -type f -exec cp {} dist/ \;
          cd dist
          sha256sum * > SHA256SUMS
          cat SHA256SUMS
      - uses: actions/attest-build-provenance@v4
        with:
          subject-path: "dist/*"
      - uses: actions/attest-sbom@v4
        with:
          subject-path: |
            dist/*.msi
            dist/*.exe
            dist/*.deb
            dist/*.rpm
            dist/*.AppImage
          sbom-path: dist/Obscura_${{ github.ref_name }}.cdx.json
      - uses: actions/attest-sbom@v4
        with:
          subject-path: |
            dist/obscura-cli_*.zip
            dist/obscura-cli_*.tar.gz
          sbom-path: dist/obscura-cli_${{ github.ref_name }}.cdx.json
      - uses: softprops/action-gh-release@v3
        with:
          draft: true
          generate_release_notes: true
          files: dist/*
