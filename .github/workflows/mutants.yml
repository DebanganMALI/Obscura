name: Mutants

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

jobs:
  mutants:
    name: cargo-mutants (obscura-vault)
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - uses: taiki-e/install-action@8cca0918f8471c33515202b73f56ab27f2bed283 # v2.87.29
        with:
          tool: cargo-mutants
      - name: System dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libxdo-dev libssl-dev \
            libayatana-appindicator3-dev librsvg2-dev libudev-dev
      - run: |
          cargo mutants --package obscura-vault --jobs 4 --minimum-test-timeout 60 \
            --exclude-re 'replace \| with \^' \
            --exclude-re 'replace < with == in PasswordPolicy::validate' \
            --exclude-re 'replace < with <= in PasswordPolicy::validate' \
            --exclude-re 'replace < with <= in encode' \
            --exclude-re 'replace > with >= in decode' \
            --exclude-re 'replace < with <= in checksum' \
            --exclude-re 'replace format_version -> u16 with 1' \
            --exclude-re 'replace <impl Drop for Entry>::drop with \(\)'
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: mutants-out
          path: mutants.out/