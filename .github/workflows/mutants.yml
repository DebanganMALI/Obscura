name: Mutants

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

jobs:
  mutants:
    name: cargo-mutants (obscura-vault)
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-mutants
      - name: System dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libxdo-dev libssl-dev \
            libayatana-appindicator3-dev librsvg2-dev libudev-dev
      - run: |
          cargo mutants --package obscura-vault --jobs 4 --minimum-test-timeout 60 \
            --exclude-re 'replace \| with \^' \
            --exclude-re 'replace < with == in PasswordPolicy::validate' \
            --exclude-re 'replace < with <= in PasswordPolicy::validate' \
            --exclude-re 'replace < with <= in encode' \
            --exclude-re 'replace > with >= in decode' \
            --exclude-re 'replace < with <= in checksum' \
            --exclude-re 'replace format_version -> u16 with 1' \
            --exclude-re 'replace <impl Drop for Entry>::drop with \(\)'
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: mutants-out
          path: mutants.out/