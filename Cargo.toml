[workspace]
resolver = "2"
members  = ["crates/*", "src-tauri"]

[workspace.package]
version      = "0.1.0"
edition      = "2021"
rust-version = "1.82"
license      = "GPL-3.0-or-later"
authors      = ["Debangan Mali <debanganmali99@gmail.com>"]
repository   = "https://github.com/DebanganMALI/Obscura"
homepage     = "https://github.com/DebanganMALI/Obscura"
description  = "Obscura - a post-quantum-hardened, open-source password manager."

[workspace.dependencies]
argon2           = { version = "0.6",  features = ["zeroize"] }
chacha20poly1305 = { version = "0.11", features = ["zeroize", "getrandom", "rand_core"] }
hkdf             = "0.13"
sha2             = { version = "0.11", features = ["zeroize"] }
blake3           = { version = "1", features = ["zeroize"] }
x25519-dalek     = { version = "2", features = ["static_secrets", "zeroize", "getrandom"] }
ml-kem           = { version = "0.3", features = ["zeroize", "getrandom"] }
subtle           = "2"
hmac             = "0.13"
sha1             = "0.11"
zeroize          = { version = "1", features = ["zeroize_derive"] }
rand_core        = { version = "0.9", features = ["os_rng"] }

serde      = { version = "1", features = ["derive"] }
serde_json = "1"
ciborium   = "0.2"
uuid       = { version = "1", features = ["v4", "serde"] }
time       = { version = "0.3", features = ["serde", "formatting", "parsing"] }

thiserror = "2"
anyhow    = "1"
tracing   = "0.1"

tauri       = { version = "2", features = [] }
tauri-build = { version = "2", features = [] }
tauri-plugin-dialog = "2"
arboard     = { version = "3", default-features = false }

obscura-crypto   = { path = "crates/obscura-crypto",   version = "0.1.0" }
obscura-vault    = { path = "crates/obscura-vault",    version = "0.1.0" }
obscura-platform = { path = "crates/obscura-platform", version = "0.1.0" }

[workspace.lints.rust]
unsafe_code           = "warn"
unused_qualifications = "warn"

[workspace.lints.clippy]
pedantic         = { level = "warn", priority = -1 }
missing_errors_doc = "allow"
missing_panics_doc = "allow"
unwrap_used      = "deny"
expect_used      = "warn"
panic            = "warn"
indexing_slicing = "warn"
mem_forget       = "deny"
todo             = "warn"

[profile.release]
opt-level       = 3
lto             = "fat"
codegen-units   = 1
panic           = "abort"
strip           = true
overflow-checks = true

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3
